# =============================================================================
# Feiyuz Blog 生产部署编排
#
# 用法：
#   1. 准备 .env.prod，填入生产数据库口令、SESSION_SECRET、APP_ORIGIN 等
#   2. docker compose -f compose.prod.yml --env-file .env.prod up -d --build
#
# 包含三个服务：
#   - postgres：业务数据库
#   - web：Next.js 应用（standalone）
#   - nginx：反向代理，对外暴露 80 端口
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: blog-postgres-prod
    restart: unless-stopped
    # 生产环境不建议暴露数据库端口到宿主机，仅容器内网可见
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-web-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 生产使用标准 PostgreSQL 连接串（非 Prisma Dev）
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      SHADOW_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/template1?sslmode=disable
      # 会话签名密钥与同源校验源，务必在生产环境覆盖
      SESSION_SECRET: ${SESSION_SECRET}
      APP_ORIGIN: ${APP_ORIGIN}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NODE_ENV: production
    # 应用上传文件持久化到命名卷，重建容器不丢失
    volumes:
      - uploads_data:/app/public/uploads
    # 仅暴露给 nginx，不直接对外
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: blog-nginx-prod
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/blog.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  uploads_data:
