# =============================================================================
# Nginx 反向代理配置示例（Feiyuz Blog）
#
# 部署时将本文件放到 nginx 的 conf.d 或 sites-enabled 下，
# 并根据实际域名修改 server_name。
# =============================================================================

# 上游 Next.js 应用服务：指向 compose.prod.yml 中的 web 容器
upstream blog_app {
    server web:3000;
}

server {
    listen 80;
    server_name your-domain.com;

    # 访问日志与错误日志
    access_log /var/log/nginx/blog_access.log;
    error_log  /var/log/nginx/blog_error.log;

    # 单请求体大小上限，影响后台图片上传
    client_max_body_size 12m;

    location / {
        proxy_pass http://blog_app;
        proxy_http_version 1.1;

        # WebSocket 支持（Next.js HMR 用，生产可保留）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 透传真实客户端信息，供日志、限流与同源校验使用
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js 静态资源缓存
    location /_next/static/ {
        proxy_pass http://blog_app;
        # 静态资源带哈希，可长期缓存
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查
    location = /api/health {
        proxy_pass http://blog_app;
        access_log off;
    }
}
